<h4 class="mb-4">{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h4>

<form class="admin-form" (ngSubmit)="onSubmit()" #productForm="ngForm">
  <div class="mb-3">
    <label class="form-label small">Product Name</label>
    <input type="text" class="form-control" [(ngModel)]="name" name="name" required />
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label small">Price (Rs.)</label>
      <input type="number" class="form-control" [(ngModel)]="price" name="price" min="0" required />
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label small">Rating (0–5)</label>
      <input type="number" class="form-control" [(ngModel)]="rating" name="rating" min="0" max="5" step="0.5" required />
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label small">Image URL</label>
    <input type="text" class="form-control" [(ngModel)]="image" name="image" required />
  </div>

  <div class="mb-3">
    <label class="form-label small">Description</label>
    <textarea class="form-control" [(ngModel)]="description" name="description" rows="3" required></textarea>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label small">Color</label>
      <select class="form-select" [(ngModel)]="color" name="color">
        @for (c of colorOptions; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label small">Status</label>
      <select class="form-select" [(ngModel)]="status" name="status">
        @for (s of statusOptions; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">
    {{ isEditMode ? 'Save Changes' : 'Add Product' }}
  </button>
</form>
