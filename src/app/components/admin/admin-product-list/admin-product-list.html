<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0">Manage Products</h4>
  <a routerLink="/admin/products/new" class="btn btn-primary">+ Add Product</a>
</div>

<div class="admin-table-wrap">
  <table class="table align-middle">
    <thead>
      <tr>
        <th></th>
        <th>Name</th>
        <th>Price</th>
        <th>Color</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (product of paginatedProducts; track product.id) {
        <tr>
          <td><img [src]="product.image" [alt]="product.name" class="admin-thumb"></td>
          <td>{{ product.name }}</td>
          <td>Rs. {{ product.price }}</td>
          <td>{{ product.color }}</td>
          <td>{{ product.status }}</td>
          <td class="text-end">
            <a [routerLink]="['/admin/products', product.id, 'edit']" class="btn btn-sm btn-outline-primary me-2">Edit</a>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(product)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <div class="pagination-controls">
    <button class="btn btn-sm btn-outline-secondary" (click)="prevPage()" [disabled]="pageIndex === 0">Previous</button>
    <span class="page-info">Page {{ pageIndex + 1 }} of {{ totalPages }}</span>
    <button class="btn btn-sm btn-outline-secondary" (click)="nextPage()" [disabled]="pageIndex >= totalPages - 1">Next</button>
  </div>
</div>
