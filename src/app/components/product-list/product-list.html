<div class="container mt-4">
  <app-breadcrumbs [items]="crumbs"></app-breadcrumbs>
  <div class="d-flex justify-content-between align-items-center mb-3">

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5><small class="text-body-secondary">{{ resultsLabel() }}</small></h5>
    <button class="btn btn-outline-secondary btn-sm" (click)="toggleFilters()">
      <i class="bi bi-funnel"></i> Filters
    </button>
  </div>

  @if (showFilters()) {
    <div class="filter-panel mb-4 p-3 border rounded">
      <div class="mb-3">
        <label class="form-label small">Max Price: Rs. {{ draftMaxPrice() }}</label>
        <input
          type="range"
          class="form-range"
          min="800"
          max="30000"
          step="500"
          [value]="draftMaxPrice()"
          (input)="onDraftPriceChange($any($event.target).value)"
        />
      </div>

      <div class="mb-3">
        <label class="form-label small d-block">Color</label>
        @for (color of colors; track color) {
          <button
            type="button"
            class="color-swatch me-2"
            [class.active]="draftColors().includes(color)"
            [style.background]="color"
            (click)="toggleDraftColor(color)"
            [attr.aria-label]="color"
          ></button>
        }
      </div>

      <button class="btn btn-primary btn-sm" (click)="applyFilters()">Apply Filters</button>
      <button class="btn btn-outline-secondary btn-sm ms-2" (click)="clearFilters()">Clear Filters</button>
    </div>
  }

  <div class="row">
  @for (product of filteredProducts(); track product.id) {
    <div class="col-6 col-md-4 col-lg-3 mb-4">
      <app-product-card [product]="product"></app-product-card>
    </div>
  }
</div>
</div>
